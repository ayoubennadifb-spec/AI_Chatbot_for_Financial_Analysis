version: '3.8'

services:
  chatbot:
    build: .
    ports:
      - "5001:5001"
    env_file:
      - .env
    volumes:
      - model_cache:/app/.model_cache   # persist RAG index + ML model across restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  model_cache:
